; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; "pio run" sin -e usa el firmware real; la demo se sube con -e demo
default_envs = esp32cam

; Placa: AI-Thinker ESP32-CAM (OV3660, 4MB PSRAM) + grabador ESP32-CAM-MB
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps = 
	espressif/esp32-camera@^2.0.4
	bblanchon/ArduinoJson@^7.4.2
	links2004/WebSockets@^2.6.1
	mikalhart/TinyGPSPlus@^1.0.3
	https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
; MODO DEMO para exponer en un salon (sin señal de GPS): la placa cree que esta en la Plaza
; San Martin (Lima) y "camina" sola a la siguiente esquina cada 20 s cuando se le pide una ruta,
; p. ej. "Vision, llevame a la Plaza de Armas". La camara, la voz, el boton y el SOS funcionan
; igual que en el firmware real. Durante la ruta, la IA va narrando el camino (modo guia) y
; avisa con tres pulsos del lado de cualquier obstaculo que vea la camara.
;   Subir la demo:        pio run -e demo -t upload
;   Volver al real:       pio run -e esp32cam -t upload
; (desconectar el TX del GPS de GPIO3 antes de subir cualquiera de los dos)
; Para empezar en otro lugar, cambiar TEST_FAKE_GPS_LAT / TEST_FAKE_GPS_LON (Google Maps: clic
; derecho en el punto -> copiar coordenadas).
[env:demo]
extends = env:esp32cam
build_flags =
    ${env:esp32cam.build_flags}
    -DTEST_FAKE_GPS_LAT=-12.0517
    -DTEST_FAKE_GPS_LON=-77.0345
    -DTEST_FAKE_WALK
    -DTEST_FAKE_WALK_MS=20000
