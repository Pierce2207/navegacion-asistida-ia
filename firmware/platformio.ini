; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; "pio run" sin -e usa el firmware real; la demo se sube con -e demo
default_envs = esp32cam

; Placa: AI-Thinker ESP32-CAM (OV3660, 4MB PSRAM) + grabador ESP32-CAM-MB
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps = 
	espressif/esp32-camera@^2.0.4
	bblanchon/ArduinoJson@^7.4.2
	links2004/WebSockets@^2.6.1
	mikalhart/TinyGPSPlus@^1.0.3
	https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
; La libreria del modelo local de "vision" (lib/halo_vision_kws_inferencing, exportada de Edge
; Impulse) solo se compila en el entorno wake-local.
lib_ignore = halo_vision_kws_inferencing

; PALABRA "VISION" DETECTADA EN LA PLACA (TinyML, Edge Impulse) en vez de la busqueda en Deepgram.
; Necesita la libreria exportada en lib/halo_vision_kws_inferencing (ver docs/wake-word/README.md).
; Si el modelo no arranca, el firmware vuelve solo a Deepgram.
;   Subir:  pio run -e wake-local -t upload
; Opcional: agregar -DWAKE_LOCAL_CONFIRM_DEEPGRAM para que Deepgram confirme cada deteccion local,
; o ajustar -DWAKE_LOCAL_THRESHOLD=0.85 (ver wake_word_local.h).
[env:wake-local]
extends = env:esp32cam
lib_ignore =
build_flags =
    ${env:esp32cam.build_flags}
    -DWAKE_WORD_LOCAL

; GRABAR MUESTRAS para entrenar el modelo de "vision" con el microfono de la placa (sin WiFi ni
; camara): manda el audio por USB a 921600 baudios. Ver docs/wake-word/README.md.
;   Subir:  pio run -e mic-capture -t upload
;   Grabar: python scripts/kws/capturar_esp32.py --puerto COM5 --salida vision_sebas.wav
[env:mic-capture]
extends = env:esp32cam
monitor_speed = 921600
build_src_filter = -<*> +<mic_capture.cpp> +<microphone.cpp> +<i2s_manager.cpp>
build_flags =
    ${env:esp32cam.build_flags}
    -DMIC_CAPTURE_SERIAL
; MODO DEMO para exponer en un salon (sin señal de GPS): la placa cree que esta en la Plaza
; San Martin (Lima) y "camina" sola a la siguiente esquina cada 20 s cuando se le pide una ruta,
; p. ej. "Vision, llevame a la Plaza de Armas". La camara, la voz, el boton y el SOS funcionan
; igual que en el firmware real. Durante la ruta, la IA va narrando el camino (modo guia) y
; avisa con tres pulsos del lado de cualquier obstaculo que vea la camara.
;   Subir la demo:        pio run -e demo -t upload
;   Volver al real:       pio run -e esp32cam -t upload
; (desconectar el TX del GPS de GPIO3 antes de subir cualquiera de los dos)
; Para empezar en otro lugar, cambiar TEST_FAKE_GPS_LAT / TEST_FAKE_GPS_LON (Google Maps: clic
; derecho en el punto -> copiar coordenadas).
[env:demo]
extends = env:esp32cam
build_flags =
    ${env:esp32cam.build_flags}
    -DTEST_FAKE_GPS_LAT=-12.0517
    -DTEST_FAKE_GPS_LON=-77.0345
    -DTEST_FAKE_WALK
    -DTEST_FAKE_WALK_MS=20000
